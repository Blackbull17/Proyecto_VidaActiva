<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaActiva — Perfil</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <a href="principal.html" class="volver">← Volver</a>
        <h1>Perfil Personal</h1>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h3>👤 Tus Datos</h3>
            <label>Nombre:</label>
            <input type="text" id="nombre" placeholder="Tu nombre">

            <label>Edad:</label>
            <input type="number" id="edad" placeholder="Edad">

            <label>Peso (kg):</label>
            <input type="number" id="peso" placeholder="Peso actual">

            <label>Estatura (cm):</label>
            <input type="number" id="estatura" placeholder="Estatura">

            <label>Nivel de actividad:</label>
            <select id="actividad">
                <option value="sedentario">Sedentario</option>
                <option value="ligero">Ligero</option>
                <option value="moderado" selected>Moderado</option>
                <option value="activo">Activo</option>
            </select>
        </section>

        <section class="tarjeta">
            <h3>🎯 Tu Meta</h3>
            <label>Objetivo:</label>
            <select id="objetivo">
                <option value="bajar">Bajar de peso</option>
                <option value="mantener">Mantener peso</option>
                <option value="subir">Ganar masa muscular</option>
            </select>

            <label>Peso objetivo (kg):</label>
            <input type="number" id="pesoMeta" placeholder="Ej: 70">

            <p class="calorias-recomendadas">🔥 Calorías recomendadas: <strong id="caloriasObjetivo">1,800 kcal/día</strong></p>
        </section>

        <button class="btn btn-principal" onclick="guardarPerfil()">Guardar cambios</button>
    </main>

    <nav class="menu-inferior">
        <a href="principal.html">Inicio</a>
        <a href="alimentacion.html">Alimentación</a>
        <a href="ejercicios.html">Ejercicios</a>
        <a href="habitos.html">Hábitos</a>
        <a href="progreso.html">Progreso</a>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
