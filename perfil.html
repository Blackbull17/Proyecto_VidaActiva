<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaActiva — Perfil</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header>
        <a href="principal.html" class="volver">← Volver</a>
        <h1>Perfil Personal</h1>
    </header>

    <main class="contenedor perfil-form">
        <form id="formPerfil" onsubmit="event.preventDefault(); guardarPerfil();">
            <section class="tarjeta">
                <h3>👤 Tus Datos</h3>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name" required>

                <label for="edad">Edad:</label>
                <input type="number" id="edad" placeholder="Edad" min="12" max="100" inputmode="numeric" required>

                <label for="sexo">Sexo (para estimar calorías):</label>
                <select id="sexo">
                    <option value="prefiero_no_decir" selected>Prefiero no decirlo</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                </select>

                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" placeholder="Peso actual" min="30" max="300" step="0.1" inputmode="decimal" required>

                <label for="estatura">Estatura (cm):</label>
                <input type="number" id="estatura" placeholder="Estatura" min="100" max="250" step="1" inputmode="numeric" required>

                <label for="actividad">Nivel de actividad:</label>
                <select id="actividad">
                    <option value="sedentario">Sedentario</option>
                    <option value="ligero">Ligero</option>
                    <option value="moderado" selected>Moderado</option>
                    <option value="activo">Activo</option>
                </select>
            </section>

            <section class="tarjeta">
                <h3>🎯 Tu Meta</h3>
                <label for="objetivo">Objetivo:</label>
                <select id="objetivo">
                    <option value="bajar">Bajar de peso</option>
                    <option value="mantener" selected>Mantener peso</option>
                    <option value="subir">Ganar masa muscular</option>
                </select>

                <label for="pesoMeta">Peso objetivo (kg, opcional):</label>
                <input type="number" id="pesoMeta" placeholder="Ej: 70" min="30" max="300" step="0.1" inputmode="decimal">

                <p class="calorias-recomendadas">🔥 Calorías recomendadas: <strong id="caloriasObjetivo">1,800 kcal/día</strong></p>
                <p class="perfil-ayuda">Es una estimación general para orientar tus porciones, no una prescripción médica.</p>
            </section>

            <button class="btn btn-principal" type="submit">Guardar cambios</button>
            <p id="estadoPerfil" class="estado-perfil" role="status" aria-live="polite"></p>
        </form>

        <a href="cambio_fisico.html" class="btn btn-secundario btn-grande" style="margin-top:12px; display:block;">
            🥗 Generar mi dieta personalizada
        </a>

        <a href="cuenta.html" class="btn btn-secundario btn-grande" style="margin-top:12px; display:block;">
            ⚙️ Mi cuenta y datos
        </a>
    </main>

    <nav class="menu-inferior">
        <a href="principal.html">Inicio</a>
        <a href="alimentacion.html">Alimentación</a>
        <a href="ejercicios.html">Ejercicios</a>
        <a href="habitos.html">Hábitos</a>
        <a href="progreso.html">Progreso</a>
    </nav>

    <script src="js/config.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
