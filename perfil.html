<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaActiva — Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="cuenta">
    <div class="app">
        <aside class="sidebar" data-va-sidebar></aside>

        <div class="app-main">
            <div class="mobile-top" data-va-mobile-top></div>

            <main class="main">
                <header class="page-head">
                    <div>
                        <span class="eyebrow">Tu cuenta</span>
                        <h1>Perfil personal</h1>
                        <p>Tus datos y metas para calcular tus calorías.</p>
                    </div>
                    <span class="page-badge verde"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></span>
                </header>

                <form id="formPerfil" class="perfil-form" onsubmit="event.preventDefault(); guardarPerfil();">
                    <section class="card">
                        <h3><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg> Tus datos</h3>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name" required>

                        <label for="edad">Edad</label>
                        <input type="number" id="edad" placeholder="Edad" min="12" max="100" inputmode="numeric" required>

                        <label for="sexo">Sexo (para estimar calorías)</label>
                        <select id="sexo">
                            <option value="prefiero_no_decir" selected>Prefiero no decirlo</option>
                            <option value="femenino">Femenino</option>
                            <option value="masculino">Masculino</option>
                        </select>

                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" placeholder="Peso actual" min="30" max="300" step="0.1" inputmode="decimal" required>

                        <label for="estatura">Estatura (cm)</label>
                        <input type="number" id="estatura" placeholder="Estatura" min="100" max="250" step="1" inputmode="numeric" required>

                        <label for="actividad">Nivel de actividad</label>
                        <select id="actividad">
                            <option value="sedentario">Sedentario</option>
                            <option value="ligero">Ligero</option>
                            <option value="moderado" selected>Moderado</option>
                            <option value="activo">Activo</option>
                        </select>
                    </section>

                    <section class="card">
                        <h3><svg class="icon" aria-hidden="true"><use href="#i-target"/></svg> Tu meta</h3>
                        <label for="objetivo">Objetivo</label>
                        <select id="objetivo">
                            <option value="bajar">Bajar de peso</option>
                            <option value="mantener" selected>Mantener peso</option>
                            <option value="subir">Ganar masa muscular</option>
                        </select>

                        <label for="pesoMeta">Peso objetivo (kg, opcional)</label>
                        <input type="number" id="pesoMeta" placeholder="Ej: 70" min="30" max="300" step="0.1" inputmode="decimal">

                        <p class="calorias-recomendadas">
                            <svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg>
                            Calorías recomendadas: <strong id="caloriasObjetivo">1,800 kcal/día</strong>
                        </p>
                        <p class="perfil-ayuda">Es una estimación general para orientar tus porciones, no una prescripción médica.</p>
                    </section>

                    <button class="btn btn-principal btn-grande" type="submit">
                        <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg> Guardar cambios
                    </button>
                    <p id="estadoPerfil" class="estado-perfil" role="status" aria-live="polite"></p>
                </form>

                <div class="acciones-fila">
                    <a href="cambio_fisico.html" class="btn btn-secundario">
                        <svg class="icon" aria-hidden="true"><use href="#i-apple"/></svg> Generar mi dieta personalizada
                    </a>
                    <a href="cuenta.html" class="btn btn-secundario">
                        <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg> Mi cuenta y datos
                    </a>
                </div>
            </main>
        </div>
    </div>

    <nav class="bottom-nav" data-va-bottom-nav aria-label="Navegación inferior"></nav>

    <script src="js/config.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
