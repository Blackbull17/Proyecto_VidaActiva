<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaActiva — Progreso</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <a href="principal.html" class="volver">← Volver</a>
        <h1>Tu Progreso</h1>
    </header>

    <main class="contenedor">
        <div class="tarjeta estadisticas">
            <h3>📊 Resumen General</h3>
            <p>Total de entrenamientos: <strong id="totalEntrenamientos">0</strong></p>
            <p>Total de minutos: <strong id="totalMinutos">0</strong></p>
            <p>Hábitos creados: <strong id="totalHabitos">0</strong></p>
            <p>Racha más larga: <strong id="rachaMaxima">0 días</strong></p>
        </div>

        <div class="tarjeta historial">
            <h3>📅 Última Actividad</h3>
            <div id="listaHistorial">
                <p class="sin-datos">Aún no tienes actividad registrada. ¡Empieza hoy! 💪</p>
            </div>
        </div>

        <a href="perfil.html" class="btn btn-secundario">Editar perfil y metas</a>
    </main>

    <nav class="menu-inferior">
        <a href="principal.html">Inicio</a>
        <a href="alimentacion.html">Alimentación</a>
        <a href="ejercicios.html">Ejercicios</a>
        <a href="habitos.html">Hábitos</a>
        <a href="progreso.html" class="activo">Progreso</a>
    </nav>

    <script src="js/config.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
